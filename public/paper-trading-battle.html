<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Market Battle — Paper Simulation</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px system-ui;color:#fff;background:#15202f}main{max-width:1080px;margin:auto;padding:26px}.warning{background:#4c2813;border:2px solid #ffaf4b;padding:14px;border-radius:12px;color:#ffe1b4}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.demos{margin:14px 0;padding:12px;background:#182642;border-radius:10px}.demos button{margin:4px;padding:8px 12px;border:1px solid #738bc3;border-radius:7px;background:#283f6a;color:#fff;cursor:pointer}.arena{margin:24px 0;padding:26px;border:2px solid var(--accent,#6377d2);border-radius:18px;background:linear-gradient(135deg,var(--arena1,#1b1643),var(--arena2,#102a4a));box-shadow:0 0 28px var(--aura,#6247aa55)}.outcome{display:grid;grid-template-columns:145px 1fr;gap:18px;align-items:center;margin:18px 0;padding:14px;background:#0a1026;border:1px solid #6578d9;border-radius:14px}.sprite-stage{height:122px;display:grid;place-items:center;background:repeating-linear-gradient(90deg,#101a39 0 12px,#0d1631 12px 24px);border-radius:10px;overflow:hidden}.sprite{position:relative;width:54px;height:54px;background:var(--accent,#62d8ff);image-rendering:pixelated;box-shadow:12px 0 var(--accent,#62d8ff),-12px 0 var(--accent,#62d8ff),0 -12px #d5f7ff,0 12px var(--accent,#3e76d2),0 24px var(--accent,#3e76d2),-18px 30px #ffce63,18px 30px #ffce63}.sprite:before{content:'';position:absolute;width:8px;height:8px;background:#101735;left:12px;top:10px;box-shadow:22px 0 #101735,11px 22px #f15d83}.sprite.diamond{transform:rotate(45deg);border:4px solid #e9ebff}.sprite.orb{border-radius:50%;box-shadow:0 0 0 10px var(--accent),0 0 24px var(--accent)}.sprite.apple{border-radius:45% 45% 50% 50%;box-shadow:14px 0 var(--accent),-14px 0 var(--accent),0 -17px #80d66b}.sprite.window{box-shadow:28px 0 var(--accent),0 28px var(--accent),28px 28px var(--accent)}.sprite.bolt{clip-path:polygon(55% 0,100% 0,62% 42%,92% 42%,20% 100%,40% 55%,8% 55%)}.attack{animation:attack .42s infinite alternate}.damage{animation:damage .32s infinite alternate;filter:hue-rotate(115deg)}.neutral{animation:recover 1.1s infinite ease-in-out}.health{height:13px;background:#1b254a;border-radius:8px;overflow:hidden;margin:7px 0}.health b{display:block;height:100%;background:linear-gradient(90deg,#ff5f7e,#ffd15e)}.fighters,.stats{display:grid;gap:14px}.fighters{grid-template-columns:1fr 80px 1fr;align-items:center}.stats{grid-template-columns:repeat(3,1fr);gap:12px}.fighter,.stat{padding:16px;border-radius:10px;background:#121d37;border:1px solid #7890e8}.fighter:last-child{background:#362137}.name{font-weight:800;font-size:20px}.bar{height:16px;border-radius:9px;background:#0b1020;margin:12px 0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#54e9c4,#b5ff7a)}.red{background:linear-gradient(90deg,#ff8d70,#fa4f93)}.versus{font-weight:900;text-align:center;font-size:32px;color:#ffdf5a;text-shadow:2px 2px #a33157}.muted{color:#c3cce5;font-size:13px}a{color:#aee8ff}table{width:100%;border-collapse:collapse;margin-top:18px;background:#111b35}td,th{padding:10px;border-bottom:1px solid #35466f;text-align:left}@keyframes attack{to{transform:translateX(19px) rotate(-6deg)}}@keyframes damage{to{transform:translateX(-8px) rotate(4deg)}}@keyframes recover{50%{transform:translateY(-6px)}}@media(max-width:620px){.fighters,.stats{grid-template-columns:1fr}.versus{order:2}.outcome{grid-template-columns:1fr}}</style></head><body><main>
<div class="top"><h1>MARKET BATTLE</h1><a href="/">← Standard dashboard</a></div><div class="warning"><b>SIMULATION ONLY — virtual USD, virtual positions, and educational visualisation.</b> No wallet, exchange account, credentials, transfer, or live order exists here.</div><div class="demos"><b>Animation preview — no trade is created:</b><button onclick="setDemo('attack')">Show gain / attack</button><button onclick="setDemo('damage')">Show loss / damage</button><button onclick="setDemo('neutral')">Show recovery</button><button onclick="setDemo('')">Use portfolio state</button></div><div id="app">Entering arena…</div>
<script>
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
const escape=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const assetThemes={BTC:{name:'Bitcoin Ember',sprite:'orb',accent:'#f5a623',arena1:'#3f2910',arena2:'#14263c',aura:'#f5a62388'},ETH:{name:'Ethereum Prism',sprite:'diamond',accent:'#aab9ff',arena1:'#24264d',arena2:'#172034',aura:'#aab9ff88'},SOL:{name:'Sol Pulse',sprite:'bolt',accent:'#8dffb0',arena1:'#153836',arena2:'#2d1650',aura:'#8dffb088'},AAPL:{name:'Apple Grove',sprite:'apple',accent:'#a5df72',arena1:'#30402a',arena2:'#182f25',aura:'#a5df7288'},MSFT:{name:'Windows Mosaic',sprite:'window',accent:'#59b9ff',arena1:'#173553',arena2:'#23345a',aura:'#59b9ff88'},TSLA:{name:'Tesla Spark',sprite:'bolt',accent:'#ff7070',arena1:'#4a1f25',arena2:'#3a2c25',aura:'#ff707088'}};
const capMilestones=[100000,500000,1000000,5000000,10000000,50000000,100000000,500000000,1000000000,5000000000,10000000000,50000000000,100000000000,500000000000,1000000000000];
let demoState=localStorage.getItem('automatonBattleDemo')||'';function setDemo(state){demoState=state;localStorage.setItem('automatonBattleDemo',state);load()}
async function load(){const d=await (await fetch('/api/state')).json(),p=d.portfolio,s=d.snapshot||{};if(!p){app.innerHTML='<p>Initialize the local simulator first.</p>';return}
 const exposure=Math.max(0,p.performance.equityUsd-p.cashUsd),limit=p.performance.equityUsd*(p.riskLimits.maxTotalExposurePct/100),pct=Math.min(100,limit?exposure/limit*100:0);
 const rows=(d.trades||[]).slice(0,5).map(t=>'<tr><td>'+new Date(t.timestamp).toLocaleString()+'</td><td>'+escape(t.side+' '+t.asset)+'</td><td>'+money(t.notionalUsd)+'</td><td>'+escape(t.rationale)+'</td></tr>').join('')||'<tr><td colspan=4>No battle moves yet — no simulated trades recorded.</td></tr>';
 const cards=Object.entries(s.pricesUsd||{}).map(([a,v])=>'<div class=stat><div class=muted>'+a+' public spot price</div><b>'+money(v)+'</b></div>').join('');
 const candidates=Object.entries(p.positions||{}).map(([asset,pos])=>({asset,position:pos,theme:assetThemes[asset],market:(s.pricesUsd?.[asset]||0)*pos.quantity,pnl:(s.pricesUsd?.[asset]||0)*pos.quantity-pos.costBasisUsd})).sort((a,b)=>Math.abs(b.pnl)-Math.abs(a.pnl));
 const focus=candidates[0],theme=focus?.theme||assetThemes.BTC,state=demoState||(focus?(focus.pnl>0?'attack':focus.pnl<0?'damage':'neutral'):'neutral'),isDemo=Boolean(demoState),health=state==='damage'?(isDemo?42:(focus?Math.max(8,100-Math.min(92,Math.abs(focus.pnl)/Math.max(1,focus.position.costBasisUsd)*100)):100)):100,label=isDemo?'ANIMATION PREVIEW — NO TRADE':state==='attack'?'PAPER GAIN — ATTACK':state==='damage'?'PAPER LOSS — DAMAGE':'NEUTRAL / RECOVERY';
 const cap=d.marketCapDemo?.enabled&&focus?d.marketCapDemo.marketCapsUsd?.[focus.asset]:null,capTier=cap?capMilestones.filter(x=>cap>=x).length:0,capLabel=cap?'Tier '+capTier+' · crossed '+money(capMilestones[Math.max(0,capTier-1)])+' market-cap milestone':'Market-cap data unavailable';
 const outcome='<section class=outcome><div class=sprite-stage><div class="sprite '+theme.sprite+' '+state+'" style="--accent:'+theme.accent+'"></div></div><div><b>'+theme.name+' · '+label+'</b><div class=health><b style="width:'+health+'%"></b></div><div class=muted>Automaton health: '+health.toFixed(1)+'% · original CSS pixel sprite art.</div><p><b>Asset:</b> '+(focus?focus.asset:'None')+' &nbsp; <b>Virtual position:</b> '+(focus?focus.position.quantity:'0')+' &nbsp; <b>Exact virtual P/L:</b> '+money(focus?focus.pnl:0)+'</p><p><b>Enemy market-cap tier:</b> '+capLabel+'</p><div class=muted>Market cap is an asset-wide metric, not this portfolio’s value or the asset price. '+(d.marketCapDemo?.enabled?'Local mock mode is enabled — visual demo only, not market data.':'No verified market-cap feed is connected.')+' Outcome timestamp: '+(s.fetchedAt?new Date(s.fetchedAt).toLocaleString():'No public-price snapshot')+'. This animation reflects only simulated paper-position value; it never represents a real trade.</div></div></section>';
 app.innerHTML='<section class=arena style="--accent:'+theme.accent+';--arena1:'+theme.arena1+';--arena2:'+theme.arena2+';--aura:'+theme.aura+'">'+outcome+'<div class=fighters><div class=fighter><div class=name>VIRTUAL CASH</div><div class=bar><div class=fill style="width:'+Math.min(100,p.cashUsd/p.startingCashUsd*100)+'%"></div></div><b>'+money(p.cashUsd)+'</b><p class=muted>Starting virtual balance: '+money(p.startingCashUsd)+'</p></div><div class=versus>VS</div><div class=fighter><div class=name>MARKET EXPOSURE</div><div class=bar><div class="fill red" style="width:'+pct+'%"></div></div><b>'+money(exposure)+' / '+money(limit)+' limit</b><p class=muted>No leverage. No shorting. Paper limit enforced.</p></div></div></section><section class=stats><div class=stat><div class=muted>Portfolio power (equity)</div><b>'+money(p.performance.equityUsd)+'</b></div><div class=stat><div class=muted>Unrealized P/L</div><b>'+money(p.performance.unrealizedPnlUsd)+'</b></div><div class=stat><div class=muted>Last public data refresh</div><b>'+(s.fetchedAt?new Date(s.fetchedAt).toLocaleString():'Unavailable')+'</b></div></section><h2>Price roster — crypto and stocks</h2><section class=stats>'+cards+'</section><h2>Recent simulated battle log</h2><table><thead><tr><th>Time</th><th>Move</th><th>Virtual amount</th><th>Learning rationale</th></tr></thead><tbody>'+rows+'</tbody></table><p class=muted>To record a rationale-required simulated trade, use the <a href="/">standard dashboard</a>. It applies the same hard paper-risk limits.</p>'}
load();setInterval(load,30000);
</script></main></body></html>
